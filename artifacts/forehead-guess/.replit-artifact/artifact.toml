kind = "web"
previewPath = "/"
title = "Forehead Guess"
version = "1.0.0"
id = "artifacts/forehead-guess"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21448

[services.development]
run = "pnpm --filter @workspace/forehead-guess run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forehead-guess", "run", "build" ]
publicDir = "artifacts/forehead-guess/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21448"
BASE_PATH = "/"
